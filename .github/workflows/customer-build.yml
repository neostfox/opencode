name: Build Custom OpenCode

on:
  push:
    branches:
      - dev
      - fix-use-system-ca
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build
        id: build
        run: |
          bun run ./packages/opencode/script/build.ts --single --no-ca
        env:
          OPENCODE_VERSION: "1.2.15"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Create GitHub Release
        shell: bash
        run: |
          TAG="custom-v${OPENCODE_VERSION}-$(date +%Y%m%d%H%M%S)"
          cd packages/opencode/dist
          tar -czf opencode-cli-windows.tar.gz *
          gh release create "$TAG" \
            opencode-cli-windows.tar.gz \
            --title "Custom Build $TAG" \
            --notes "Custom build from commit ${{ github.sha }}" \
            --prerelease
        env:
          OPENCODE_VERSION: "1.2.11"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
